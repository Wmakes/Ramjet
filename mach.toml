[project]
id = "ramjet"
version = "0.5.0"
mach = "^7"
src  = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"


[artifact.ramjet]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/ramjet{artifact.suffix}"
targets = ["*"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi  = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"


[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v10.0.0"
